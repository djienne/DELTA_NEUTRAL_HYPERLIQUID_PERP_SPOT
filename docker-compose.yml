services:
  delta-neutral-bot:
    build: .
    container_name: hyperliquid-bot
    restart: unless-stopped

    # Optional runtime overrides (e.g. MIN_HOLD_TIME_MS); credentials live in hyperliquid.env
    env_file:
      - path: .env
        required: false
    environment:
      BOT_STATE_FILE: /app/data/bot-state.json

    # Volume mounts for persistent data
    volumes:
      # Persist bot state across container restarts
      - ./data:/app/data
      # Credentials (never baked into the image: *.env is dockerignored)
      - ./hyperliquid.env:/app/hyperliquid.env:ro
      # Optional: Mount config if you want to modify without rebuilding
      - ./config.json:/app/config.json:ro

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check (optional - checks if bot process is running)
    healthcheck:
      test: ["CMD", "pgrep", "-f", "node"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Paper trading: same bot and code, simulated account (utils/paper-exchange.js) on live market data.
  # Not started by plain `docker compose up -d`; start it with:
  #   docker compose --profile paper up -d paper-bot
  # Stats: python paper_stats.py   |   Reset: docker compose stop paper-bot, delete ./data-paper/, start again
  paper-bot:
    build: .
    profiles: [paper]
    container_name: hyperliquid-paper-bot
    # Network outages are ridden out in-process; this restarts it if the process dies and, with Docker Desktop set to
    # start at sign-in, after PC restarts
    restart: unless-stopped
    environment:
      PAPER_TRADING: "1"  # state always in /app/data-paper (bot.js)
    # No credentials on purpose: the paper account signs with a throwaway key and never reaches /exchange
    volumes:
      - ./data-paper:/app/data-paper
      - ./config.json:/app/config.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Optional: Add a network for future expansion (e.g., monitoring)
networks:
  default:
    name: hyperliquid-network
